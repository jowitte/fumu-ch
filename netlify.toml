[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 verlangt Node >= 22.12.0. "22" loest auf die neueste 22.x auf und
  # erfuellt das; bei einem Engine-Fehler im Deploy-Log hier die Minor pinnen.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Link = '''</llms.txt>; rel="describedby", </llms-full.txt>; rel="describedby"'''

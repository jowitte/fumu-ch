# Site-Sample für AI-Crawler-Policy-Analyse.
#
# Struktur: top-level Schlüssel = category, darunter Liste von Sites.
# Felder pro Site:
#   name         Anzeigename (kurz, lesbar)
#   url          Hostname ohne Schema, ohne trailing slash
#   region       CH | DE | AT | EU | US | UK | Global
#                  EU      = Europa ausser CH/DE/AT/UK
#                  Global  = international / nicht-westlich (z.B. AliExpress, Temu)
#   subcategory  optional, primär für Brands (retail, fmcg, telco, banking,
#                insurance, automotive, energy, transport, fashion, luxury,
#                industrial, software, hospitality)
#
# Stand: 2026-04-27. Erster Vorschlag für Brands/ECommerce — User editiert.

